services:
  app:
    image: python:3.12-slim
    working_dir: /app
    env_file:
      - path: .env
        required: false
    environment:
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-true}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-mba-ia-pull-evaluation-prompt}
    volumes:
      - ./:/app
      - python_deps:/usr/local
    command: ["sh", "-c", "pip install -r requirements.txt && exec sleep infinity"]

volumes:
  python_deps:
